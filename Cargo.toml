[package]
name = "rustcube"
version = "0.1.0"
authors = ["Michael Sierks <msierks@117@gmail.com>"]
license = "MIT/Apache-2.0"
edition = "2021"

[[bin]]
name = "rustcube"
doc = false

[dependencies]
bitfield = "0.19"
byteorder = "1.5"
encoding_rs = "0.8"
getopts = "0.2"
env_logger = "0.11"
minifb = "0.28"
log = { version = "0.4", features= ["std"] }

[profile.dev]
opt-level = 3
overflow-checks = true
